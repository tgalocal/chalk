# Anchored facts for git2docs. Exact strings the docs must reproduce that are
# not derivable from extracted surfaces. Every entry is anchored to its source.

authority:
  # Pointers, never copies. These surfaces are extracted directly.
  public_types: source/index.d.ts
  style_names: source/vendor/ansi-styles/index.js
  package_manifest: package.json

facts:
  compatibility:
    - id: node_engine
      value: ">=22"
      src: package.json:22
      match: '"node": ">=22"'
    - id: ci_tested_node_26
      value: 26
      src: .github/workflows/main.yml:13
      match: "- 26"
      note: CI tests only Node 26 and 22. Other versions are not tested.
    - id: ci_tested_node_22
      value: 22
      src: .github/workflows/main.yml:14
      match: "- 22"
    - id: module_format
      value: ESM only
      src: package.json:8
      match: '"type": "module"'
      note: >-
        There is no CommonJS build. Do not claim require('chalk') can never work.
        On Node >=22.12, require('chalk') loads the ESM module (the default export
        is .default). Only earlier Node 22 releases throw ERR_REQUIRE_ESM.
    - id: no_tagged_templates_in_core
      value: Tagged template literals are provided by chalk-template, not by chalk itself.
      src: readme.md:310
      match: "[chalk-template](https://github.com/chalk/chalk-template)"
      note: >-
        chalk.red`a ${x}` is not supported. With interpolation the raw string
        array is coerced and the values are appended after a space, e.g.
        chalk.green`Hello ${name}` yields "Hello , Sindre". The values are
        misplaced, not discarded.
    - id: no_runtime_dependencies
      value: Chalk has no dependencies.
      src: readme.md:298
      match: Chalk has no dependencies.
      src_files:
        - source/vendor/ansi-styles/index.js
        - source/vendor/supports-color/index.js
      note: ansi-styles and supports-color are vendored under source/vendor, not installed.

  color_level:
    - id: style_access_returns_new_builder
      value: Each style property access or color method call returns a NEW builder function, cached on its parent. It never returns `this`.
      src: source/index.js:71
      match: "const builder = createBuilder(this, createStyler(style.open, style.close, this[STYLER]), this[IS_EMPTY]);"
      note: new Chalk({level:1}).red === instance is false, and so is .hex('#fff') === instance.
    - id: style_conflict_last_wins
      value: Later styles open after earlier ones, so the last conflicting style in a chain wins. chalk.yellow.red renders red and chalk.red.yellow renders yellow.
      src: source/index.js:159
      match: "openAll = parent.openAll + open;"
    - id: level_range_error
      value: The `level` should be an integer from 0 to 3
      src: source/index.js:19
      match: "throw new Error('The `level` should be an integer from 0 to 3');"
    - id: force_color_overrides_flags
      value: An env FORCE_COLOR value replaces the --color/--no-color flag result, so FORCE_COLOR=1 with --no-color gives level 1.
      src: source/vendor/supports-color/index.js:72-75
      match: "flagForceColor = noFlagForceColor;"
      note: --no-color does not disable color "unconditionally". Only --color=256 and --color=16m beat a non-zero FORCE_COLOR.
    - id: flag_force_disable
      value: --no-color
      src: source/vendor/supports-color/index.js:18
      match: "hasFlag('no-color')"
    - id: flag_force_enable
      value: --color
      src: source/vendor/supports-color/index.js:25
      match: "\thasFlag('color')"
      note: --color guarantees at least level 1 (and color on non-TTY streams). It does not cap the level; detection continues, e.g. TERM=xterm-256color gives 2.
    - id: flag_256
      value: --color=256
      src: source/vendor/supports-color/index.js:90
      match: "hasFlag('color=256')"
    - id: flag_truecolor
      value: --color=16m
      src: source/vendor/supports-color/index.js:84
      match: "hasFlag('color=16m')"
    - id: force_color_true_enables_without_level
      value: FORCE_COLOR=true
      src: source/vendor/supports-color/index.js:47
      match: "env.FORCE_COLOR === 'true'"
      note: true (or empty) only enables color at level 1 or above. A numeric value sets the level exactly.
    - id: force_color_numeric_cap
      value: numeric FORCE_COLOR is capped at 3
      src: source/vendor/supports-color/index.js:55
      match: "Math.min(Number.parseInt(env.FORCE_COLOR, 10), 3)"

  browser:
    - id: browser_entry
      value: ./source/vendor/supports-color/browser.js
      src: package.json:17
      match: '"default": "./source/vendor/supports-color/browser.js"'
      note: Non-Node runtimes get the browser color detector through the #supports-color import condition.
    - id: browser_truecolor_threshold
      value: Chromium brand version > 93 gives level 3
      src: source/vendor/supports-color/browser.js:8
      match: "brand?.version > 93"
    - id: browser_chrome_user_agent_fallback
      value: Any other Chrome/Chromium user agent gives level 1. Only a runtime without navigator, or a non-Chromium browser, gives level 0.
      src: source/vendor/supports-color/browser.js:13
      match: "/\\b(?:Chrome|Chromium)\\//.test(globalThis.navigator.userAgent)"
    - id: browser_entry_condition
      value: The browser detector is selected by the "default" condition of the #supports-color entry in package.json "imports" (not "exports"). There is no "browser" condition.
      src: package.json:17
      match: '"default": "./source/vendor/supports-color/browser.js"'
      near: '"#supports-color"'
    - id: browser_console_support
      value: Since Chrome 69, ANSI escape codes are natively supported in the developer console.
      src: readme.md:282
      match: Since Chrome 69
      note: This is the repo's own prose and is authoritative here.
